<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Guide — Companion to the Printed Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      padding: 3rem 1.5rem;
    }
    main { max-width: 38rem; text-align: center; }
    h1 {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: var(--step-4);
      margin: 0 0 1rem;
    }
    p { color: var(--ink-soft); line-height: 1.55; }
    .eyebrow {
      font-size: var(--step--1);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1.5rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 2.5rem 0 0;
      display: grid;
      gap: 0.75rem;
    }
    li a {
      display: block;
      padding: 1rem 1.25rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      color: var(--ink);
      text-decoration: none;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: var(--step-1);
      transition: border-color 0.2s, transform 0.2s;
    }
    li a:hover {
      border-color: #0E3147;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The Guide</p>
    <h1>The companion to the printed edition.</h1>
    <p>
      You've probably arrived here by scanning a QR code from the guide
      in your room. Each business featured in print has its own page —
      pick yours below.
    </p>
    <ul>
      <li><a href="/broken-bay-pearl-farm/">Broken Bay Pearl Farm →</a></li>
    </ul>
  </main>
</body>
</html>
